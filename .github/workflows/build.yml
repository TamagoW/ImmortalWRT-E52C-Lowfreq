name: Build ImmortalWrt E52C (full + lite CPU frequency ladder)

# The repository only needs TWO files (GitHub web upload cannot create folders):
#   1. .github/workflows/build.yml   <- this file (create with "Create new file")
#   2. recipe.zip                    <- single-file archive of the whole recipe
# The first step of this workflow unzips recipe.zip in place, restoring
# config/, patches/, tools/, build.sh etc. before compiling.
#
# Then: Actions -> "Build ImmortalWrt E52C (full + lite CPU frequency ladder)"
#               -> Run workflow
#
# ONE run produces TWO firmware images, in two independent artifacts:
#   immortalwrt-e52c-lowfreq-full-<branch>   30/39/39 OPPs, 96 MHz floor
#   immortalwrt-e52c-lowfreq-lite-<branch>   11/14/14 OPPs, 96 MHz floor
#
# Mirror profile defaults to "china": the main repo, all 5 feeds repos,
# git-based source downloads and raw.githubusercontent.com are routed through
# a Chinese GitHub proxy. ImmortalWrt 25.12 already lists Chinese mirrors
# first for GNU / kernel.org / Debian / Apache tarballs.
# NOTE: GitHub-hosted runners are overseas - if the China proxy is slower or
# flaky there, re-run with mirror_profile=direct. build.sh also auto-falls
# back to a secondary proxy and then to github.com if a clone fails.
#
# Free runners have limited disk; the "Free disk space" step removes
# preinstalled SDKs to make room for the OpenWrt build tree (~30 GB).

on:
  workflow_dispatch:
    inputs:
      branch:
        description: ImmortalWrt branch
        required: true
        default: 'openwrt-25.12'
        type: string
      mirror_profile:
        description: Download mirror profile (china = CN GitHub proxy, direct = native github.com)
        required: true
        default: 'china'
        type: choice
        options:
          - 'china'
          - 'direct'

jobs:
  build:
    name: Build ${{ matrix.variant }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: full
            opp_patch: '900-rk3588-lowfreq-opp-full.patch'
          - variant: lite
            opp_patch: '901-rk3588-lowfreq-opp-lite.patch'

    env:
      OPP_PATCH: ${{ matrix.opp_patch }}
      IW_BRANCH: ${{ inputs.branch }}
      JOBS: 4
      # ---- China mirror environment variables (change mirror_profile=direct to bypass) ----
      MIRROR_PROFILE: ${{ inputs.mirror_profile }}
      IW_REPO: ${{ inputs.mirror_profile == 'china' && 'https://gh-proxy.com/https://github.com/immortalwrt/immortalwrt.git' || 'https://github.com/immortalwrt/immortalwrt.git' }}
      GH_MIRROR_PREFIX: ${{ inputs.mirror_profile == 'china' && 'https://gh-proxy.com/' || '' }}
      FALLBACK_GH: ${{ inputs.mirror_profile == 'china' && 'https://ghfast.top/' || '' }}
      # DOWNLOAD_MIRROR is intentionally empty: scripts/projectsmirrors.json is
      # already CN-first. Set a ;-separated list here to add your own dl mirror.
      DOWNLOAD_MIRROR: ''

    steps:
      - name: Checkout recipe
        uses: actions/checkout@v4

      - name: Unpack build recipe
        run: |
          python3 - <<'PY'
          import glob, os, sys, zipfile
          z = 'recipe.zip' if os.path.isfile('recipe.zip') else (sorted(glob.glob('*.zip')) or [None])[0]
          if z:
              with zipfile.ZipFile(z) as f:
                  names = f.namelist()
                  bad = [n for n in names if n.startswith('/') or '..' in n.split('/')]
                  if bad:
                      print('::error::unsafe paths in zip:', bad)
                      sys.exit(1)
                  f.extractall('.')
              print('unpacked', len(names), 'files from', z)
          else:
              print('no recipe.zip found - assuming files were pushed directly with git')
          PY
          for f in build.sh config/config.seed config/packages.list tools/check_opp.py "patches/$OPP_PATCH"; do
            test -f "$f" || { echo "::error::missing $f - upload recipe.zip or push the recipe files"; exit 1; }
          done
          chmod +x build.sh
          echo "recipe restored:"; ls -lh build.sh patches/*.patch config/config.seed

      - name: Show build configuration
        run: |
          echo "variant       : ${{ matrix.variant }}"
          echo "OPP patch     : ${{ matrix.opp_patch }}"
          echo "branch        : ${{ inputs.branch }}"
          echo "mirror profile: $MIRROR_PROFILE"
          echo "IW_REPO       : $IW_REPO"
          echo "GH prefix     : ${GH_MIRROR_PREFIX:-<none>}"
          echo "fallback      : ${FALLBACK_GH:-<none>}"

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost \
                      /usr/local/lib/android /opt/hostedtoolcache/CodeQL \
                      /usr/local/share/powershell /usr/share/swift || true
          sudo apt-get clean || true
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update
          # Core toolchain - package names stable across Ubuntu 22.04/24.04.
          sudo apt-get install -y --no-install-recommends \
            autoconf automake autopoint binutils bison build-essential bzip2 \
            ccache clang cmake cpio curl device-tree-compiler flex gawk gettext \
            gcc-multilib g++-multilib git gnutls-dev libelf-dev libglib2.0-dev \
            libncurses-dev libssl-dev libtool-bin make patch python3 python3-dev \
            rsync unzip uuid-dev wget xz-utils zlib1g-dev file gperf help2man \
            lib32gcc-s1 libc6-dev-i386
          # Optional/legacy packages: names changed on newer runners, tolerate absence.
          for p in ack antlr3 asciidoc ecj fastjar intltool python3-distutils swig; do
            sudo apt-get install -y --no-install-recommends "$p" || echo "skip optional $p"
          done
          git config --global user.name  "CI Builder"
          git config --global user.email "ci@localhost"

      - name: Validate OPP patches
        run: python3 tools/check_opp.py

      - name: Cache downloaded sources
        uses: actions/cache@v4
        with:
          path: build/immortalwrt/dl
          key: immortalwrt-dl-${{ inputs.branch }}-v2
          restore-keys: |
            immortalwrt-dl-${{ inputs.branch }}-

      - name: Build firmware
        run: |
          chmod +x build.sh
          ./build.sh

      - name: List build output
        if: always()
        run: |
          ls -lh out/ || true
          tail -n 60 build.log 2>/dev/null || true

      - name: Upload firmware (${{ matrix.variant }})
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-e52c-lowfreq-${{ matrix.variant }}-${{ inputs.branch }}
          path: |
            out/*.img.gz
            out/SHA256SUMS.txt
            out/MISSING_PACKAGES.txt
          if-no-files-found: error
          retention-days: 14
